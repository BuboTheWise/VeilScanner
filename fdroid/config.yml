# F-Droid Manual Repository Configuration for VoidScanner
# This config is used with `fdroid` CLI tools for manual repo management.

##############################################
# General Repository Metadata
##############################################
repo_url: https://BuboTheWise.github.io/VoidScanner/fdroid/repo
repo_name: Void Scanner
repo_icon: repo-icon.png
repo_country: US

##############################################
# App Signing Configuration
##############################################
# These settings must match the keystore used to sign release APKs.
# Keystore location: app/voidscanner.keystore (PKCS12 format)
#
repo_keyalias: voidscanner
keystore: ../app/voidscanner.keystore
keystorepass: void123
keypass: void123

##############################################
# Repository Signing Key Fingerprint (SHA-1)
##############################################
# This is the SHA-1 fingerprint of the certificate in the keystore.
# Command to verify: keytool -list -v -keystore app/voidscanner.keystore
repo_pubkey: 9411820DAE10C3D4CF1324A1C38808046AE39517

##############################################
# Manual Repo Notes
##############################################
# repo_url MUST end with '/repo' (no trailing slash) or fdroid update will CRITICAL fail.
# For manual repos, metadata goes in fdroid/repo/metadata/<package>.yml

