Summary: Sensor data collection for Nethervoid Network void resonance analysis

Description: |
  The core scanner for the Nethervoid Network — explore the void between
  networked devices through comprehensive sensor analysis. Collects WiFi
  and Bluetooth signatures offline-first, generating deterministic seeds
  for game entity generation.

  Features:
  - WiFi and BLE signal detection
  - JSON export to Downloads folder
  - Real-time scan feedback
  - Privacy-aware data handling

  Integration: Void Resonator component of Nethervoid Network, intended
  for standalone testing and later integration into the full Nethervoid
  application.

  Requirements: Android 10+ (API 29+), no internet required

